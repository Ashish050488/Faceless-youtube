# Narration on GitHub Actions (owner 2026-11-18: "move just audio for now").
# Trigger: a push to main that adds/changes scripts/<slug>/script.md, or a manual run with a slug.
# Output: orphan branch handoff/<slug>-voice with voice.wav, words.json, voice_seconds.txt, timing.txt.
# Locked settings (PRODUCTION_SPEC §5): Kokoro af_heart 0.795, gaps 0.30/0.42, config/pronunciations.json.
name: voice
on:
  push:
    branches: [main]
    paths: ["scripts/*/script.md"]
  workflow_dispatch:
    inputs:
      slug: {description: "scripts/<slug>", required: true}
permissions:
  contents: write
concurrency: {group: voice, cancel-in-progress: false}
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Which scripts changed
        id: slugs
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then S="${{ github.event.inputs.slug }}"
          else S=$(git diff --name-only HEAD~1 HEAD -- 'scripts/*/script.md' | cut -d/ -f2 | sort -u | tr '\n' ' '); fi
          echo "list=$S" >> "$GITHUB_OUTPUT"; echo "slugs: $S"
      - uses: actions/setup-python@v5
        if: steps.slugs.outputs.list != ''
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/voice.yml}
      - name: Cache models (Kokoro, spaCy, Whisper)
        if: steps.slugs.outputs.list != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-v1
      # apt on ubuntu-24.04 runners can stall 20+ min retrying azure.archive.ubuntu.com (actions/runner-images#14594)
      # or hang after a mid-download abort (Nov 2026). Bounded timeouts + retries, fallback to archive.ubuntu.com.
      - name: Install system tools (espeak-ng, ffmpeg)
        if: steps.slugs.outputs.list != ''
        timeout-minutes: 8
        env: {DEBIAN_FRONTEND: noninteractive}
        run: |
          if command -v espeak-ng >/dev/null && command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "espeak-ng + ffmpeg already on the image"; exit 0; fi
          A="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          try() { sudo timeout 150 apt-get $A update -q && sudo timeout 240 apt-get $A install -y -q --no-install-recommends espeak-ng ffmpeg; }
          if ! try; then
            echo "::warning::apt stalled on the runner mirror; switching to archive.ubuntu.com"
            sudo rm -rf /var/lib/apt/lists/partial/*
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            try
          fi
          espeak-ng --version; ffprobe -version | head -1
      - name: Install Python packages
        if: steps.slugs.outputs.list != ''
        timeout-minutes: 15
        run: |
          P="--timeout 60 --retries 5 --progress-bar off --disable-pip-version-check"
          pip install $P --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.15.0" | grep -E "Successfully|ERROR" || true
          pip install $P "kokoro==0.9.4" "misaki[en]==0.9.4" "spacy==3.8.18" "faster-whisper==1.2.1" "numpy==2.5.5" soundfile librosa num2words scipy | grep -E "Successfully|ERROR" || true
          python -c "import torch, kokoro, misaki, faster_whisper; print('python stack OK, torch', torch.__version__)"
      - name: Narrate and push
        timeout-minutes: 15
        if: steps.slugs.outputs.list != ''
        run: |
          git config user.name "voice-bot"; git config user.email "voice-bot@users.noreply.github.com"
          for SLUG in ${{ steps.slugs.outputs.list }}; do
            O=$RUNNER_TEMP/$SLUG; mkdir -p "$O"
            python audio/narrate.py "scripts/$SLUG/script.md" af_heart 0.795 "$O/voice.wav" 0.30 0.42 2>&1 | grep -vi warn | tail -2
            python -m meta.align_words "scripts/$SLUG/script.md" "$O/voice.wav" "$O/words.json" 2>&1 | grep -vi warn | tail -1
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$O/voice.wav" > "$O/voice_seconds.txt"
            python audio/measure_timing.py "$O/voice.wav" > "$O/timing.txt" 2>/dev/null || true
            cat "$O/voice_seconds.txt" "$O/timing.txt"
            (cd "$O" && sha256sum voice.wav words.json > sha256.txt && git init -q -b "handoff/$SLUG-voice" \
              && git add -f . && git -c user.name=voice-bot -c user.email=voice-bot@users.noreply.github.com commit -qm "voice for $SLUG" \
              && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/handoff/$SLUG-voice")
            echo "pushed handoff/$SLUG-voice"
          done
